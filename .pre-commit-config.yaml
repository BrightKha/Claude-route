repos:
  - repo: local
    hooks:
      - id: no-secrets
        name: secret scan (scripts/check_secrets.py)
        entry: uv run python scripts/check_secrets.py --staged
        language: system
        pass_filenames: false
      - id: no-env-files
        name: forbid .env files
        entry: .env files must never be committed
        language: fail
        files: '(^|/)\.env($|\.(?!example$))'
      - id: ruff
        name: ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: bandit
        name: bandit
        entry: uv run bandit -q -r src -c pyproject.toml
        language: system
        pass_filenames: false
        types: [python]
